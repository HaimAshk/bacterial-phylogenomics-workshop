# Environment 2: gain/loss, co-evolution and gene-content GWAS (handout steps 5-6)
#   conda env create -f envs/phylo-gwas.yml && conda activate phylo-gwas
#   Rscript -e 'devtools::install_github("caitiecollins/treeWAS", build_vignettes=FALSE)'
# GLOOME pins numpy<2, which is why this is a separate environment.
name: phylo-gwas
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy<2
  - pandas
  - scipy
  - matplotlib
  - pyseer
  - r-base
  - r-devtools
  - r-igraph
  - pip
  - pip:
      - gloome
